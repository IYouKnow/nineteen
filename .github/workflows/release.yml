name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build & publish image, create release
    runs-on: ubuntu-latest
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute image repo (lowercase)
        id: img
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.repo }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.img.outputs.repo }}:latest

      - name: Log in to Docker Hub (optional)
        if: env.DH_USER != '' && env.DH_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}

      - name: Build and push to Docker Hub (optional)
        if: env.DH_USER != '' && env.DH_TOKEN != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          push: true
          tags: |
            ${{ env.DH_USER }}/nineteen:${{ steps.ver.outputs.version }}
            ${{ env.DH_USER }}/nineteen:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Nineteen ${{ github.ref_name }}
          generate_release_notes: true
