services:
  nineteen:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nineteen
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    # Explicit resolvers for outbound name resolution. Docker snapshots the
    # host's /etc/resolv.conf into the container at creation time (for the
    # embedded resolver's upstreams); if the host has no non-loopback nameserver
    # -- e.g. a minimal host, or systemd-resolved exposing only 127.0.0.53 --
    # every external hostname SERVFAILs and clones of GitHub/Gitea die with
    # "Could not resolve host". Defaults are public resolvers; override in .env
    # when you depend on internal/split-horizon DNS.
    dns:
      - "${NINETEEN_DNS:-1.1.1.1}"
      - "${NINETEEN_DNS_FALLBACK:-8.8.8.8}"
    environment:
      ADDR: ":8080"
      DB_PATH: "/app/data/nineteen.db"
      STATIC_DIR: "/app/static"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in the .env file}"
      INVITE_CODE: "${INVITE_CODE:?Set INVITE_CODE in the .env file}"
      # GitHub repo that hosts the Nineteen source; used by the self-update
      # feature to check for and pull new releases.
      NINETEEN_REPO: "${NINETEEN_REPO:?Set NINETEEN_REPO in the .env file}"
      # Interface deployed project ports are published on. 0.0.0.0 (default)
      # makes project URLs reachable from other machines; use 127.0.0.1 to keep
      # them local to the host.
      NINETEEN_PROJECT_BIND: "${NINETEEN_PROJECT_BIND:-0.0.0.0}"
    volumes:
      # The app deploys project containers on the *host* Docker daemon, so it
      # needs the daemon socket. Project containers run on the host network,
      # not nested inside this container.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist the SQLite database (and any build/local state) on the host.
      - ./data:/app/data
